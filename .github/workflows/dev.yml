name: "DEVELOPMENT DEPLOY"

on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    uses: ./.github/workflows/terraform.yml
    with:
      environment: dev
      aws-assume-role-arn: 'arn:aws:iam::652099910794:role/github-actions'
      aws-region: 'us-east-1'
      aws-statefile-s3-bucket: "wms-terraform-statefile"
      aws-lock-dynamodb-table: "wms-terraform-lock"